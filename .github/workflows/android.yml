name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 24 for Vercel server tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vercel/package-lock.json

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('export_presets.cfg').read_text()
          values = re.findall(r'^version/name="([^"]+)"$', text, re.M)
          if len(values) != 1 or not re.fullmatch(r'\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?', values[0]):
              raise SystemExit('Expected one semantic version/name in export_presets.cfg')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={values[0]}\ntag=v{values[0]}\n')
          PY

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          RAMI_ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$RAMI_ANDROID_SDK" || ! -w "$RAMI_ANDROID_SDK" ]]; then
            RAMI_ANDROID_SDK="$RUNNER_TEMP/rami-android-sdk"
            mkdir -p "$RAMI_ANDROID_SDK"
          fi
          RAMI_SDKMANAGER="$RAMI_ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$RAMI_SDKMANAGER" ]]; then
            RAMI_SDKMANAGER=""
            for RAMI_CANDIDATE in "$RAMI_ANDROID_SDK"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$RAMI_CANDIDATE" ]]; then
                RAMI_SDKMANAGER="$RAMI_CANDIDATE"
                break
              fi
            done
          fi
          if [[ -z "$RAMI_SDKMANAGER" ]]; then
            RAMI_SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$RAMI_SDKMANAGER" ]]; then
            RAMI_COMMANDLINE_DIR="$RUNNER_TEMP/rami-android-commandline"
            mkdir -p "$RAMI_COMMANDLINE_DIR"
            curl --fail --location --retry 3 --retry-delay 2 "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" --output "$RUNNER_TEMP/rami-android-commandline.zip"
            unzip -q "$RUNNER_TEMP/rami-android-commandline.zip" -d "$RAMI_COMMANDLINE_DIR"
            RAMI_SDKMANAGER="$RAMI_COMMANDLINE_DIR/cmdline-tools/bin/sdkmanager"
          fi
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/rami-android-license-input.txt"
          "$RAMI_SDKMANAGER" --sdk_root="$RAMI_ANDROID_SDK" --licenses < "$RUNNER_TEMP/rami-android-license-input.txt"
          "$RAMI_SDKMANAGER" --sdk_root="$RAMI_ANDROID_SDK" "platform-tools" "build-tools;36.0.0"
          echo "RAMI_ANDROID_SDK=$RAMI_ANDROID_SDK" >> "$GITHUB_ENV"
          "$RAMI_ANDROID_SDK/platform-tools/adb" start-server

      - name: Install verified Godot and Android export template
        shell: bash
        run: |
          set -euo pipefail
          RAMI_GODOT_DIR="$RUNNER_TEMP/rami-godot"
          mkdir -p "$RAMI_GODOT_DIR"
          cd "$RAMI_GODOT_DIR"
          RAMI_RELEASE_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          for RAMI_ASSET in "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" "SHA512-SUMS.txt"; do
            curl --fail --location --retry 3 --retry-delay 2 "$RAMI_RELEASE_URL/$RAMI_ASSET" --output "$RAMI_ASSET"
          done
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          version = os.environ['GODOT_VERSION']
          wanted = {f'Godot_v{version}-stable_linux.x86_64.zip', f'Godot_v{version}-stable_export_templates.tpz'}
          verified = set()
          for line in Path('SHA512-SUMS.txt').read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              name = name.lstrip('*')
              if name in wanted:
                  with open(name, 'rb') as stream:
                      actual = hashlib.file_digest(stream, 'sha512').hexdigest()
                  if actual != digest:
                      raise SystemExit(f'Checksum mismatch: {name}')
                  verified.add(name)
          if verified != wanted:
              raise SystemExit('Missing official Godot checksums')
          print('Official Godot SHA512 checksums verified')
          PY
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          version = os.environ['GODOT_VERSION']
          data = Path(os.environ.get('XDG_DATA_HOME', str(Path.home() / '.local/share')))
          templates = data / 'godot/export_templates' / f'{version}.stable'
          templates.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(f'Godot_v{version}-stable_export_templates.tpz') as archive:
              for name in ['android_debug.apk', 'version.txt']:
                  (templates / name).write_bytes(archive.read(f'templates/{name}'))
          PY
          echo "GODOT_BIN=$RAMI_GODOT_DIR/godot" >> "$GITHUB_ENV"

      - name: Configure protected Android signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SIGNING'
          import base64, binascii, json, os, subprocess
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          present = [bool(os.environ.get(name, '')) for name in names]
          if any(present) and not all(present):
              raise SystemExit('Incomplete Android signing configuration. Configure all four secrets listed in docs/SIGNING.md.')
          durable = all(present)
          keystore = Path(os.environ['RUNNER_TEMP']) / 'rami-signing.keystore'
          if durable:
              try:
                  raw = base64.b64decode(''.join(os.environ[names[0]].split()), validate=True)
              except (ValueError, binascii.Error):
                  raise SystemExit('ANDROID_KEYSTORE_BASE64 is not a valid base64 keystore.')
              if not raw or len(raw) > 65536:
                  raise SystemExit('Unexpected Android keystore size.')
              keystore.write_bytes(raw)
              store_password, alias, key_password = (os.environ[name] for name in names[1:])
          else:
              store_password, alias, key_password = 'android', 'androiddebugkey', 'android'
          command_env = os.environ.copy()
          command_env['RAMI_SIGN_STORE_PASS'] = store_password
          command_env['RAMI_SIGN_KEY_PASS'] = key_password
          if not durable:
              generated = subprocess.run(['keytool', '-genkeypair', '-noprompt', '-keystore', str(keystore), '-alias', alias, '-storepass:env', 'RAMI_SIGN_STORE_PASS', '-keypass:env', 'RAMI_SIGN_KEY_PASS', '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000', '-dname', 'CN=Rami Temporary Test, O=Rami Salon, C=FR'], env=command_env, capture_output=True)
              if generated.returncode:
                  raise SystemExit('Could not create the temporary artifact-only signing key.')
          keystore.chmod(0o600)
          csr = Path(os.environ['RUNNER_TEMP']) / 'rami-signing-check.csr'
          checked = subprocess.run(['keytool', '-certreq', '-keystore', str(keystore), '-alias', alias, '-storepass:env', 'RAMI_SIGN_STORE_PASS', '-keypass:env', 'RAMI_SIGN_KEY_PASS', '-file', str(csr)], env=command_env, capture_output=True)
          csr.unlink(missing_ok=True)
          if checked.returncode:
              raise SystemExit('Android signing key validation failed. Check the keystore, alias and passwords.')
          config = Path(os.environ.get('XDG_CONFIG_HOME', str(Path.home() / '.config'))) / 'godot'
          config.mkdir(parents=True, exist_ok=True)
          settings = {
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
              'export/android/android_sdk_path': os.environ['RAMI_ANDROID_SDK'],
              'export/android/debug_keystore': str(keystore),
              'export/android/debug_keystore_user': alias,
              'export/android/debug_keystore_pass': store_password,
          }
          if key_password != store_password:
              raise SystemExit('This standard Godot APK export requires the key password to match the keystore password. Reconfigure a compatible keystore before publishing.')
          text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          text += ''.join(f'{name} = {json.dumps(value)}\n' for name, value in settings.items())
          settings_file = config / 'editor_settings-4.6.tres'
          settings_file.write_text(text)
          settings_file.chmod(0o600)
          mode = 'durable' if durable else 'temporary-test'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publishable={str(durable).lower()}\nmode={mode}\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RAMI_SIGNING_MODE={mode}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Android signature: protected durable key.\n' if durable else 'Android signature: temporary test artifact only. Version publication requires the four secrets in docs/SIGNING.md.\n')
          print('Protected durable signing configured.' if durable else 'No durable signing secrets: this APK is an artifact-only test build.')
          PY_SIGNING

      - name: Import project and test gameplay
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --import 2>&1 | tee "$RUNNER_TEMP/rami-import.log"
          if grep -nE 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/rami-import.log"; then
            exit 1
          fi
          timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_engine.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_network.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_game_ui.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_update_ui.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_beginner_coach.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_sorting.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_music.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_card_input.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_animations.gd
          XDG_DATA_HOME="$RUNNER_TEMP/rami-mobile-tests" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_mobile_gameplay.gd
          XDG_DATA_HOME="$RUNNER_TEMP/rami-solver-tests" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_solver_forfeit.gd
          XDG_DATA_HOME="$RUNNER_TEMP/rami-session-tests" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_session_forfeit.gd
          XDG_DATA_HOME="$RUNNER_TEMP/rami-forfeit-ui-tests" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_forfeit_ui.gd
          XDG_DATA_HOME="$RUNNER_TEMP/rami-tutorial-tests" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_tutorial_practice.gd
          XDG_DATA_HOME="$RUNNER_TEMP/rami-comfort-tests" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_accessibility.gd
          timeout 120 python3 tests/test_signing_setup.py
          timeout 120 python3 tests/test_android_device_setup.py
          XDG_DATA_HOME="$RUNNER_TEMP/tri-tutorial" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_tri_tutorial.gd
          XDG_DATA_HOME="$RUNNER_TEMP/opponent-gestures" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_opponent_gestures.gd
          XDG_DATA_HOME="$RUNNER_TEMP/card-foley" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_sound_effects.gd
          XDG_DATA_HOME="$RUNNER_TEMP/upgrade-ui" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_upgrade_v7.gd
          XDG_DATA_HOME="$RUNNER_TEMP/tri-rules" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_tri.gd
          XDG_DATA_HOME="$RUNNER_TEMP/tri-ui" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_tri_ui.gd
          XDG_DATA_HOME="$RUNNER_TEMP/tri-lan" timeout 120 "$GODOT_BIN" --headless --path . --script tests/test_tri_lan.gd
          timeout 120 python3 tests/test_tri_network.py
          timeout 120 python3 tests/test_internet.py
          timeout 120 python3 tests/test_forfeit_server.py
          timeout 120 python3 tests/test_server_restart.py

      - name: Verify Vercel multiplayer and Godot rules parity
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          npm ci --prefix vercel
          "$GODOT_BIN" --headless --path . --script vercel/tests/export_godot_parity.gd -- --out="$RUNNER_TEMP/godot-parity.json"
          GODOT_PARITY_FILE="$RUNNER_TEMP/godot-parity.json" timeout 240 npm test --prefix vercel

      - name: Verify rendered hand and touch picking
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          LIBGL_ALWAYS_SOFTWARE=1 timeout 120 xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tests/test_hand_view.gd 2>&1 | tee "$RUNNER_TEMP/rami-render.log"
          if grep -nE 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/rami-render.log"; then
            exit 1
          fi

      - name: Verify rendered mobile gestures and recovery
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="$RUNNER_TEMP/rami-mobile-ui" timeout 120 xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tests/test_mobile_ui.gd 2>&1 | tee "$RUNNER_TEMP/rami-mobile-ui.log"
          if grep -nE 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/rami-mobile-ui.log"; then
            exit 1
          fi

      - name: Verify rendered beginner tutorial
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="$RUNNER_TEMP/rami-tutorial-ui" timeout 120 xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tests/test_tutorial_practice.gd 2>&1 | tee "$RUNNER_TEMP/rami-tutorial-ui.log"
          if grep -nE 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/rami-tutorial-ui.log"; then
            exit 1
          fi

      - name: Verify rendered comfort settings
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="$RUNNER_TEMP/rami-comfort-ui" timeout 120 xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tests/test_accessibility.gd 2>&1 | tee "$RUNNER_TEMP/rami-comfort-ui.log"
          if grep -nE 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/rami-comfort-ui.log"; then
            exit 1
          fi

      - name: Verify rendered Tri hands
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="$RUNNER_TEMP/tri-render" timeout 120 xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tests/test_tri_ui.gd 2>&1 | tee "$RUNNER_TEMP/tri-render.log"
          if grep -nE 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/tri-render.log"; then exit 1; fi

      - name: Verify realistic table and opponent hands
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="$RUNNER_TEMP/table-realism" timeout 120 xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tests/test_table_realism.gd 2>&1 | tee "$RUNNER_TEMP/table-realism.log"
          if grep -nE 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/table-realism.log"; then exit 1; fi

      - name: Verify Tri tutorial and grouped private hands
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="$RUNNER_TEMP/tri-lesson-render" timeout 120 xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tests/test_tri_tutorial.gd 2>&1 | tee "$RUNNER_TEMP/tri-lesson-render.log"
          LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="$RUNNER_TEMP/upgrade-render" timeout 120 xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tests/test_upgrade_v7.gd 2>&1 | tee "$RUNNER_TEMP/upgrade-render.log"
          if grep -nE 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/tri-lesson-render.log" "$RUNNER_TEMP/upgrade-render.log"; then exit 1; fi

      - name: Export and verify Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          "$GODOT_BIN" --headless --path . --export-debug Android builds/rami-3d.apk 2>&1 | tee "$RUNNER_TEMP/rami-export.log"
          if grep -nE 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/rami-export.log"; then
            exit 1
          fi
          "$RAMI_ANDROID_SDK/build-tools/36.0.0/apksigner" verify --verbose builds/rami-3d.apk | tee builds/android-signature.txt
          "$RAMI_ANDROID_SDK/build-tools/36.0.0/zipalign" -c -P 16 4 builds/rami-3d.apk
          unzip -t builds/rami-3d.apk > "$RUNNER_TEMP/rami-integrity.log"
          "$RAMI_ANDROID_SDK/build-tools/36.0.0/aapt" dump badging builds/rami-3d.apk > builds/android-package.txt
          python3 scripts/test-android-device.py --sdk "$RAMI_ANDROID_SDK" --apk builds/rami-3d.apk --report builds/android-device-report.json
          git archive --format=zip --prefix=rami-3d/ HEAD --output=builds/rami-salon-3d-sources.zip
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          apk = Path('builds/rami-3d.apk')
          text = '\n'.join([
              'Rami Salon 3D — GitHub Actions Android test build',
              f'Commit: {os.environ["GITHUB_SHA"]}',
              f'Workflow run: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              'Godot: 4.6.3 / Java: 21 / Android build-tools: 36.0.0',
              f'Signing mode: {os.environ.get("RAMI_SIGNING_MODE", "unknown")}; APK signature, ZIP integrity and 16 KB alignment verified.',
              f'APK SHA256: {hashlib.sha256(apk.read_bytes()).hexdigest()}',
              'Durable mode keeps the configured signing certificate across published updates; temporary-test artifacts cannot replace a published app.',
              'No physical Android device test was performed by this workflow.',
              'Internet multiplayer requires hosting the included game server.',
          ])
          Path('builds/CI-BUILD-INFO.txt').write_text(text + '\n')
          PY
          cd builds
          sha256sum rami-3d.apk rami-salon-3d-sources.zip CI-BUILD-INFO.txt > SHA256SUMS

      - name: Upload downloadable build artifacts
        id: apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: rami-android-${{ steps.version.outputs.version }}-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            builds/rami-3d.apk
            builds/rami-salon-3d-sources.zip
            builds/SHA256SUMS
            builds/CI-BUILD-INFO.txt
            builds/android-signature.txt
            builds/android-package.txt
            builds/android-device-report.json

      - name: Explain test-only APK availability
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.signing.outputs.publishable != 'true'
        env:
          RAMI_APK_ARTIFACT_URL: ${{ steps.apk_artifact.outputs.artifact-url }}
        shell: bash
        run: |
          echo "::notice::Tests and APK export succeeded. Release publication is skipped until durable Android signing is configured. Download the test APK from this run's artifacts."
          {
            echo '### APK de test disponible'
            echo
            echo 'Les tests et la compilation Android ont réussi. Aucune version avec une signature temporaire ne sera publiée dans Releases.'
            echo
            echo "**[Télécharger l’APK de test (archive ZIP)]($RAMI_APK_ARTIFACT_URL)**"
            echo
            echo "1. Ouvrir [cette compilation]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), puis sa section **Artifacts**."
            echo '2. Télécharger l’archive `rami-android-…`, la décompresser, puis ouvrir **rami-3d.apk** sur le téléphone. Le fichier ZIP ne s’installe pas directement.'
            echo '3. Pour les mises à jour avec une signature conservée, configurer les quatre secrets décrits dans **docs/SIGNING.md**, puis relancer ce workflow.'
            echo
            echo 'Une ancienne application signée avec une autre clé ne peut pas être mise à jour par cet APK de test. Une désinstallation efface les sauvegardes locales.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish version if it does not already exist
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.signing.outputs.publishable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RAMI_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          RAMI_STATUS=$(curl --silent --show-error --output "$RUNNER_TEMP/rami-existing-release.json" --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RAMI_TAG")
          case "$RAMI_STATUS" in
            200)
              echo "Release $RAMI_TAG already exists; its files and tag are preserved. This build remains available in Actions artifacts."
              ;;
            404)
              gh release create "$RAMI_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Rami Salon 3D $RAMI_TAG" --prerelease --notes-file docs/release-notes.md builds/rami-3d.apk builds/rami-salon-3d-sources.zip builds/SHA256SUMS builds/CI-BUILD-INFO.txt builds/android-signature.txt builds/android-package.txt
              ;;
            *)
              echo "Cannot check existing release (HTTP $RAMI_STATUS). No release was changed."
              exit 1
              ;;
          esac

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          python3 - <<'PY_CLEANUP'
          import os
          from pathlib import Path
          for name in ['rami-signing.keystore', 'rami-signing-check.csr']:
              (Path(os.environ['RUNNER_TEMP']) / name).unlink(missing_ok=True)
          config = Path(os.environ.get('XDG_CONFIG_HOME', str(Path.home() / '.config'))) / 'godot/editor_settings-4.6.tres'
          config.unlink(missing_ok=True)
          PY_CLEANUP
